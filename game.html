<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />

	<link rel="stylesheet" href="game.css" />
	<link rel="shortcut icon" type="image/jpg" href="images/favicon.png"/>

	<!-- third-party libraries -->
	<script src="libs/astar.js"></script>

	<!-- shared tools (also used by other projects) -->
	<script src="libs/geometry.js"></script>
	<script src="libs/helperFuncs.js"></script>

	<!-- sprite and input infrastructure -->
	<script src="libs/sprite.js"></script>
	<script src="libs/kbListener.js"></script>
	<script src="libs/mouseHandler.js"></script>

	<!-- game code — order matters -->
	<script src="src/config.js"></script>
	<script src="src/Item.js"></script>
	<script src="src/rng.js"></script>
	<script src="src/bits.js"></script>
	<script src="src/generator.js"></script>
	<script src="src/Entity.js"></script>
	<script src="src/Player.js"></script>
	<script src="src/Enemy.js"></script>
	<script src="src/Corpse.js"></script>
	<script src="src/render.js"></script>
	<script src="src/SaveManager.js"></script>
	<script src="src/Panel.js"></script>
	<script src="src/InventoryPanel.js"></script>
	<script src="src/CharacterPanel.js"></script>
	<script src="src/Game.js"></script>
	<script src="src/main.js"></script>
</head>
<body>
	<div id="overlay">
		<canvas id="gameCanvas"></canvas>

		<!-- Modal backdrop; only shown when a panel is open -->
		<div id="ui-backdrop"></div>

		<!-- Sidebar -->
		<div id="sidebar">
			<button class="sidebar-button" id="btn-inventory" title="Inventory (I)">
				<span class="sidebar-caption">Inventory</span>
			</button>

			<button class="sidebar-button" id="btn-character" title="Character (C)">
				<span class="sidebar-caption">Player</span>
			</button>

			<div class="sidebar-separator"></div>

			<button class="sidebar-button" id="btn-save" title="Save">
				<span class="sidebar-caption">Save</span>
			</button>

			<button class="sidebar-button" id="btn-load" title="Load">
				<span class="sidebar-caption">Load</span>
			</button>
		</div>

		<!-- Panels; only one visible at a time -->
		<div id="panel-inventory" class="panel">
			<div class="panel-inner">
				<div class="panel-header">
					<span>Inventory</span>
					<button class="panel-close" aria-label="Close">×</button>
				</div>
				<div class="panel-body" id="panel-inventory-body"></div>
			</div>
		</div>

		<div id="panel-character" class="panel">
			<div class="panel-header">
				<span>Character</span>
				<button class="panel-close" aria-label="Close">×</button>
			</div>
			<div class="panel-body"></div>
		</div>
	</div>
</body>
</html>
